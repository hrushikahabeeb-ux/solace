# coturn configuration for Solace voice/video calls (see DEPLOYMENT.md).
# Install coturn natively (e.g. `sudo apt install coturn` on Ubuntu/Debian), copy this
# file to /etc/turnserver.conf, fill in the two REPLACE_ME values, then
# `sudo systemctl enable --now coturn`.
#
# The relay only ever forwards DTLS-SRTP ciphertext, never anything it could decrypt.
# Open UDP+TCP 3478 and UDP 49160-49200 on the firewall.

realm=solace
use-auth-secret
# Same value as TURN_SECRET in apps/server/.env
static-auth-secret=REPLACE_ME_WITH_TURN_SECRET
# The server's public IP address
external-ip=REPLACE_ME_WITH_PUBLIC_IP

listening-port=3478
min-port=49160
max-port=49200
fingerprint
no-cli
no-tls
no-dtls
log-file=stdout

# Never let a relay be used to reach the host's private network (SSRF hardening).
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
